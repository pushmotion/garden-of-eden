# OPTIONAL ALTERNATIVE to the built-in scheduler -- do not run both.
#
# This fork schedules lights and pump runs itself: the web UI writes a schedule
# to ~/.garden_schedule.json, app/sensors/schedule/schedule.py compiles it into
# the Pi's crontab, and the "Lights Schedule" / "Pump Schedule" switches in Home
# Assistant turn that on and off. Cron then drives the hardware directly.
#
# These automations do the same job from HA's side. Import them and the tower
# has two schedulers with no knowledge of each other: cron sets the light from
# the saved schedule, HA sets it again from the times below, and the actuator
# reconcile loop faithfully publishes the resulting flapping.
#
# So: use these ONLY with the built-in schedule switched off (Lights Schedule /
# Pump Schedule OFF, or lights.enabled / pump.enabled false in the schedule
# file). For anything per-day or multi-window, prefer the built-in scheduler --
# it survives a reboot without HA and is what the web UI edits.
#
# Entity ids assume MQTT_IDENTIFIER=gardyn_01; porting is a find/replace.
alias: Gardyn Pump
description: Schedule for Gardyn pump control
trigger:
  - platform: time
    at: "09:30:00"
    id: "on"
  - platform: time
    at: "09:35:00"
    id: "off"
  - platform: time
    at: "16:00:00"
    id: "on"
  - platform: time
    at: "16:05:00"
    id: "off"
  - platform: time
    at: "21:00:00"
    id: "on"
  - platform: time
    at: "21:05:00"
    id: "off"
action:
  # light.*, not fan.*: the pump is announced in the `light` domain, so a
  # fan service call fails with unknown-entity on every trigger. The
  # `device_class: fan` in its discovery payload is cosmetic -- the MQTT light
  # platform ignores it -- and is what made `fan.turn_on` look correct here.
  - service: light.turn_{{trigger.id}}
    target:
      entity_id: light.gardyn_01_pump
mode: queued
