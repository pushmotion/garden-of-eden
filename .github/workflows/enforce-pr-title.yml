name: Enforce PR Title Format

on:
  pull_request:
    types: [opened, edited, reopened]

jobs:
  check-title:
    name: 'Enforce PR Title Format'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        uses: deepakputhraya/action-pr-title@v1.0.2
        with:
          # The Conventional Commit types documented in CONTRIBUTORS.md. Keep
          # the two in step: this list previously allowed 'jira', 'proj-' and
          # 'hotfix' (left over from the action's example config and never used
          # here) while rejecting 'perf', 'build', 'chore', 'style' and
          # 'refactor', which CONTRIBUTORS.md documents and the history uses.
          allowed_prefixes: 'feat,fix,docs,style,refactor,perf,test,build,ci,chore,revert'
          # disallowed_prefixes: 'feat/,hotfix' # title should not start with the given prefix
          prefix_case_sensitive: false # title prefix are case insensitive
          min_length: 5 # Min length of the title
          # 72, not git's customary 50. That 50 is guidance for a bare subject
          # line; a Conventional Commit spends part of its budget before the
          # description starts -- "feat(camera): " is already 14 -- so 50 left
          # 36 for the actual summary and rejected honest titles. 72 is the
          # other common git wrap point and keeps `git log --oneline` readable.
          max_length: 72 # Max length of the title
          github_token: ${{ secrets.GITHUB_TOKEN }}
