name: CI

on:
  push:
    # feat/gardyn-tower-local is the build branch the Pi deploys from, so a push
    # to it reaches live hardware at the next bin/autoupdate.sh tick. Gate it
    # directly rather than relying on every change going through a PR.
    branches: [main, feat/gardyn-tower-local]
  pull_request:

jobs:
  test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4

      # Runs before anything else: a leaked credential is worth failing fast on,
      # and this needs no toolchain. .gitignore does not help once a file is
      # tracked -- adding the rule afterwards leaves the file in the index, which
      # is exactly how a Home Assistant token reached a public PR here.
      - name: No secret files may be tracked
        run: |
          set -euo pipefail
          pattern='(^|/)(\.ha_token|.*\.token|.*\.pem|.*\.key|.*_rsa|\.env)$'
          if git ls-files | grep -inE "$pattern"; then
            echo "::error::The files above are secrets and must never be committed."
            echo "Untrack with: git rm --cached <file>   (and rotate the credential —"
            echo "anything that reached a remote must be treated as compromised)."
            exit 1
          fi
          echo "No secret files tracked."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: Unit tests
        # Hardware libraries are stubbed by tests/_hwstub.py, so no Pi needed.
        run: python -m unittest discover -t . -s tests -p 'test_*.py'
