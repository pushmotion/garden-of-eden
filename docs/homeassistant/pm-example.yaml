# PushMotion example dashboard -- Home Assistant "Sections" layout.
#
# One of two examples in this folder; pick whichever you prefer:
#   lovelace-example.yaml  -- plain single-column card list (upstream style)
#   pm-example.yaml        -- this file: grouped sections, status-first
#
# Paste into: Settings -> Dashboards -> (your dashboard) -> Edit -> (three dots)
# -> "Raw configuration editor". This replaces the whole dashboard config.
#
# Entity IDs assume MQTT_BASETOPIC=gardyn. MQTT discovery builds entity ids as
# <domain>.<device>_<entity name>, and the HA device is named after the base
# topic -- so "Water Depth" becomes sensor.gardyn_water_depth. Verify in
# Developer Tools -> States by filtering on "gardyn"; if your base topic
# differs, one find/replace of "gardyn_" fixes the whole file. The two cameras
# are the exception -- their discovery payloads set object_id, so they carry
# MQTT_IDENTIFIER (gardyn_01) instead.
#
# Sections require HA 2024.3+. Drag section headers to reorder, drag cards
# between sections, and resize cards from the edit view.

title: Garden of Eden
views:
  - title: Tower
    path: tower
    type: sections
    max_columns: 3

    # The few things worth seeing before you scroll.
    badges:
      - type: entity
        entity: binary_sensor.gardyn_water_low
        color: red
      - type: entity
        entity: sensor.gardyn_water_remaining
      - type: entity
        entity: sensor.gardyn_next_pump_run
      - type: entity
        entity: sensor.gardyn_grow_day

    sections:

      # ==================================================================
      # 1. STATUS -- everything you check without touching anything.
      #    Grouped water / grow / mode, since those answer different
      #    questions even though they share the section.
      # ==================================================================
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Tower Status
            heading_style: title
            icon: mdi:sprout-outline

          # ---- Water -----------------------------------------------------
          - type: heading
            heading: Water
            heading_style: subtitle
            icon: mdi:water

          - type: tile
            entity: binary_sensor.gardyn_water_low
            name: Water Low
            icon: mdi:water-alert
            color: red

          - type: gauge
            entity: sensor.gardyn_water_remaining
            name: Water Remaining
            min: 0
            max: 100
            needle: true
            severity:
              green: 40
              yellow: 20
              red: 0

          - type: tile
            entity: sensor.gardyn_water_depth
            name: Water Depth
            icon: mdi:waves-arrow-up

          - type: tile
            entity: sensor.gardyn_water_gallons
            name: Estimated Gallons
            icon: mdi:cup-water

          # The two controls that define when "Water Low" trips, kept with the
          # sensor they govern rather than exiled to a settings section.
          - type: entities
            title: Low-water alert
            show_header_toggle: false
            entities:
              - entity: number.gardyn_set_water_low_threshold
                name: Trip below (cm)
              - entity: sensor.gardyn_water_low_mode
                name: Detection mode

          # ---- Grow cycle ------------------------------------------------
          - type: heading
            heading: Grow Cycle
            heading_style: subtitle
            icon: mdi:sprout

          - type: tile
            entity: select.gardyn_grow_stage
            name: Grow Stage
            icon: mdi:sprout
            features:
              - type: select-options

          - type: tile
            entity: sensor.gardyn_grow_day
            name: Grow Day
            icon: mdi:calendar-clock

          - type: tile
            entity: binary_sensor.gardyn_add_plant_food
            name: Add Plant Food
            icon: mdi:bottle-tonic-plus
            color: amber

          - type: tile
            entity: sensor.gardyn_grow_reminder
            name: Reminder
            icon: mdi:bell-alert

          - type: tile
            entity: button.gardyn_start_new_grow_cycle
            name: Start New Grow Cycle
            icon: mdi:restart
            tap_action:
              action: toggle

          # ---- Mode ------------------------------------------------------
          # Vacation mode overrides BOTH schedules with a reduced keep-alive
          # profile, so it belongs to neither section below.
          - type: heading
            heading: Mode
            heading_style: subtitle
            icon: mdi:airplane

          - type: tile
            entity: switch.gardyn_vacation_mode
            name: Vacation Mode
            icon: mdi:airplane

          - type: markdown
            content: >
              Vacation mode replaces **both** the light and pump schedules with
              a reduced keep-alive profile until its end date passes, then
              reverts on its own via the nightly refresh.

      # ==================================================================
      # 2. LIGHTING -- the light and the schedule that drives it.
      # ==================================================================
      - type: grid
        cards:
          - type: heading
            heading: Lighting
            heading_style: title
            icon: mdi:lightbulb-on-outline

          - type: tile
            entity: light.gardyn_light
            name: Grow Light
            icon: mdi:white-balance-sunny
            features_position: bottom
            features:
              - type: light-brightness

          - type: heading
            heading: Light Schedule
            heading_style: subtitle
            icon: mdi:calendar-clock

          - type: entities
            show_header_toggle: false
            entities:
              - entity: switch.gardyn_lights_schedule
                name: Schedule enabled
              - entity: time.gardyn_lights_on_time
                name: Lights on
              - entity: time.gardyn_lights_off_time
                name: Lights off
              - entity: number.gardyn_schedule_brightness
                name: Brightness

          - type: markdown
            content: >
              With a multi-window schedule these controls edit it rather than
              replace it: **Brightness** applies to every existing window and
              keeps the window count, and **Lights on** / **Lights off** move
              only the first window of each day. A single scalar cannot express
              the later windows -- add, remove, or retime those in the tower web
              UI heatmap.

      # ==================================================================
      # 3. PUMP -- the pump and its recurring schedule. Both setters are
      #    surgical as of b05497e, so they live in one card with the
      #    read-only state they affect.
      # ==================================================================
      - type: grid
        cards:
          - type: heading
            heading: Pump
            heading_style: title
            icon: mdi:water-pump

          - type: tile
            entity: light.gardyn_pump
            name: Pump
            icon: mdi:water-pump
            features_position: bottom
            features:
              # The pump is published as an MQTT light; brightness == speed %.
              - type: light-brightness

          - type: heading
            heading: Pump Schedule
            heading_style: subtitle
            icon: mdi:calendar-clock

          - type: entities
            show_header_toggle: false
            entities:
              - entity: switch.gardyn_pump_schedule
                name: Schedule enabled
              - entity: time.gardyn_pump_run_time
                name: First run at
              - entity: number.gardyn_pump_run_duration
                name: Minutes per run
              - type: divider
              - entity: sensor.gardyn_next_pump_run
                name: Next run
              - entity: sensor.gardyn_max_pump_run_time
                name: Hard cap per run

          - type: markdown
            content: >
              With a multi-cycle schedule (currently seven runs a day), these
              two controls edit it rather than replace it: **Minutes per run**
              applies to every existing run and keeps the run count, and
              **First run at** moves only the first run of each day. A single
              scalar cannot express the other six runs -- add, remove, or
              retime those in the tower web UI heatmap.

      # ==================================================================
      # 4. ONE-TIME PUMP RUN -- additive, never touches the recurring
      #    schedule (its cron entries live under a separate marker).
      # ==================================================================
      - type: grid
        cards:
          - type: heading
            heading: One-Time Pump Run
            heading_style: title
            icon: mdi:water-plus-outline

          - type: entities
            show_header_toggle: false
            entities:
              - entity: time.gardyn_manual_pump_run_time
                name: Run at
              - entity: button.gardyn_one_time_pump_run
                name: Arm one-time run
              - type: divider
              - entity: sensor.gardyn_pending_one_time_pump_run
                name: Pending run

          - type: markdown
            content: >
              Set the time, then press **Arm one-time run**. This writes a
              single dated cron entry under its own marker and leaves the
              recurring schedule untouched; spent entries are pruned by the
              nightly refresh.

      # ==================================================================
      # 5. ENVIRONMENT -- ambient readings, nothing actionable.
      # ==================================================================
      - type: grid
        cards:
          - type: heading
            heading: Environment
            heading_style: title
            icon: mdi:thermometer

          - type: tile
            entity: sensor.gardyn_temperature
            name: Air Temperature
          - type: tile
            entity: sensor.gardyn_humidity
            name: Humidity
          - type: tile
            entity: sensor.gardyn_pcb_temperature
            name: PCB Temperature
          - type: tile
            entity: sensor.gardyn_water_level
            name: Sensor Distance

      # ==================================================================
      # 6. CAMERAS
      # ==================================================================
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Cameras
            heading_style: title
            icon: mdi:camera

          - type: picture-entity
            entity: image.gardyn_01_upper_camera
            name: Upper
            camera_view: auto
          - type: picture-entity
            entity: image.gardyn_01_lower_camera
            name: Lower
            camera_view: auto

      # ==================================================================
      # 7. DIAGNOSTICS -- polling, logs, and the physical button. These are
      #    entity_category: diagnostic, so HA hides them from the
      #    auto-generated device page; they only appear if listed here.
      # ==================================================================
      - type: grid
        cards:
          - type: heading
            heading: Diagnostics
            heading_style: title
            icon: mdi:stethoscope

          - type: entities
            show_header_toggle: false
            entities:
              - entity: button.gardyn_refresh_all
                name: Refresh all sensors
              - entity: sensor.gardyn_refresh_status
                name: Refresh status
              - entity: sensor.gardyn_last_refresh
                name: Last refresh
              - type: divider
              - entity: event.gardyn_button
                name: Physical button
              - entity: sensor.gardyn_last_log
                name: Last warning/error

