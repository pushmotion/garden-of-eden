# Example dashboard -- Home Assistant "Sections" layout (issue #63).
#
# One of two examples in this folder:
#   sections-example.yaml  -- this file: grouped sections, status-first, and the
#                             only one covering all 40 discovered entities
#   lovelace-example.yaml  -- plain single-column card list, a 24-entity SUBSET;
#                             see its header for what it omits
#
# Prefer this file unless you specifically want the shorter starting point.
#
# Paste into: Settings -> Dashboards -> (your dashboard) -> Edit -> (three dots)
# -> "Raw configuration editor". This replaces the whole dashboard config.
#
# PORTING THIS TO ANOTHER TOWER: find/replace "gardyn_01" with that unit's
# MQTT_IDENTIFIER. Nothing else changes.
#
# Every discovery payload pins object_id to its unique_id, so entity ids are
# always <domain>.<MQTT_IDENTIFIER>_<suffix> -- identical in shape on every
# tower, and immune to renaming an entity in the HA UI. The suffix is the
# unique_id, which is not always the slug of the display name:
#
#   Water Remaining  -> sensor.<id>_water_percent
#   PCB Temperature  -> sensor.<id>_pcb_temp
#   Add Plant Food   -> binary_sensor.<id>_food
#   Last Refresh     -> sensor.<id>_refresh_last
#   Last Log         -> sensor.<id>_log
#   Lights Schedule  -> switch.<id>_sched_lights
#
# That is deliberate: the display name is cosmetic, the unique_id is the
# contract, and an entity must not move because someone retitled it.
#
# NOTE: object_id only takes effect when an entity is FIRST created. A tower
# that was discovered before this change keeps its old ids until its device is
# deleted in HA and re-discovered. bin/ha-align-entity-ids.py renames them in
# place instead, which keeps recorder history attached to the entity.
#
# Sections require HA 2024.3+. Drag section headers to reorder, drag cards
# between sections, and resize cards from the edit view.

title: Garden of Eden
views:
  - title: Tower
    path: tower
    type: sections
    max_columns: 3

    # The few things worth seeing before you scroll.
    badges:
      - type: entity
        entity: binary_sensor.gardyn_01_water_low
        color: red
      - type: entity
        entity: sensor.gardyn_01_water_percent
      - type: entity
        entity: sensor.gardyn_01_pump_next_run
      - type: entity
        entity: sensor.gardyn_01_grow_day

    sections:

      # ==================================================================
      # 1. STATUS -- everything you check without touching anything.
      #    Grouped water / grow / mode, since those answer different
      #    questions even though they share the section.
      # ==================================================================
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Tower Status
            heading_style: title
            icon: mdi:sprout-outline

          # ---- Water -----------------------------------------------------
          - type: heading
            heading: Water
            heading_style: subtitle
            icon: mdi:water

          - type: tile
            entity: binary_sensor.gardyn_01_water_low
            name: Water Low
            icon: mdi:water-alert
            color: red

          - type: gauge
            entity: sensor.gardyn_01_water_percent
            name: Water Remaining
            min: 0
            max: 100
            needle: true
            severity:
              green: 40
              yellow: 20
              red: 0

          - type: tile
            entity: sensor.gardyn_01_water_depth
            name: Water Depth
            icon: mdi:waves-arrow-up

          - type: tile
            entity: sensor.gardyn_01_water_gallons
            name: Estimated Gallons
            icon: mdi:cup-water

          # The two controls that define when "Water Low" trips, kept with the
          # sensor they govern rather than exiled to a settings section.
          - type: entities
            title: Low-water alert
            show_header_toggle: false
            entities:
              - entity: number.gardyn_01_water_low_cm
                name: Warn below (cm)
              - entity: sensor.gardyn_01_pump_cutoff_cm
                name: Stop pump below (cm)
              - entity: sensor.gardyn_01_water_low_mode
                name: Detection mode

          - type: markdown
            content: >
              Two thresholds, both **airgaps** — the distance down to the water,
              so a larger number means less water. **Warn below** raises the
              alert; **Stop pump below** is where watering actually stops. The
              gap between them is deliberate: a warning you can act on should
              not also refuse to water a tank that still has plenty.


              The cutoff is read-only here. It is a safety limit rather than a
              per-run setting, so it lives in `.env` alongside the tank geometry
              that gives both numbers their meaning — a threshold copied from
              another tower means a different percentage on this one.

          # ---- Grow cycle ------------------------------------------------
          - type: heading
            heading: Grow Cycle
            heading_style: subtitle
            icon: mdi:sprout

          - type: tile
            entity: select.gardyn_01_grow_stage
            name: Grow Stage
            icon: mdi:sprout
            features:
              - type: select-options

          - type: tile
            entity: sensor.gardyn_01_grow_day
            name: Grow Day
            icon: mdi:calendar-clock

          - type: tile
            entity: binary_sensor.gardyn_01_food
            name: Add Plant Food
            icon: mdi:bottle-tonic-plus
            color: amber

          - type: tile
            entity: sensor.gardyn_01_grow_reminder
            name: Reminder
            icon: mdi:bell-alert

          # Clearing a reminder from here, rather than having to open the web
          # UI. The recurring ones never go OFF by themselves, so without these
          # the alarm above stays lit and cannot drive an automation.
          - type: entities
            title: Mark done
            show_header_toggle: false
            entities:
              - entity: button.gardyn_01_ack_nutrient
                name: Fed the plants
              - entity: button.gardyn_01_ack_reservoir_change
                name: Changed the reservoir

          - type: tile
            entity: button.gardyn_01_grow_start
            name: Start New Grow Cycle
            icon: mdi:restart
            tap_action:
              action: toggle

          # ---- Mode ------------------------------------------------------
          # Vacation mode overrides BOTH schedules with a reduced keep-alive
          # profile, so it belongs to neither section below.
          - type: heading
            heading: Mode
            heading_style: subtitle
            icon: mdi:airplane

          - type: tile
            entity: switch.gardyn_01_vacation
            name: Vacation Mode
            icon: mdi:airplane

          - type: markdown
            content: >
              Vacation mode replaces **both** the light and pump schedules with
              a reduced keep-alive profile until its end date passes, then
              reverts on its own via the nightly refresh.

      # ==================================================================
      # 2. LIGHTING -- the light and the schedule that drives it.
      # ==================================================================
      - type: grid
        cards:
          - type: heading
            heading: Lighting
            heading_style: title
            icon: mdi:lightbulb-on-outline

          - type: tile
            entity: light.gardyn_01_light
            name: Grow Light
            icon: mdi:white-balance-sunny
            features_position: bottom
            features:
              - type: light-brightness

          - type: heading
            heading: Light Schedule
            heading_style: subtitle
            icon: mdi:calendar-clock

          - type: entities
            show_header_toggle: false
            entities:
              - entity: switch.gardyn_01_sched_lights
                name: Schedule enabled
              - entity: time.gardyn_01_sched_lights_on
                name: Lights on
              - entity: time.gardyn_01_sched_lights_off
                name: Lights off
              - entity: number.gardyn_01_sched_lights_brightness
                name: Brightness

          - type: markdown
            content: >
              With a multi-window schedule these controls edit it rather than
              replace it: **Brightness** applies to every existing window and
              keeps the window count, and **Lights on** / **Lights off** move
              only the first window of each day. A single scalar cannot express
              the later windows -- add, remove, or retime those in the tower web
              UI heatmap.

      # ==================================================================
      # 3. PUMP -- the pump and its recurring schedule. Both setters are
      #    surgical as of b05497e, so they live in one card with the
      #    read-only state they affect.
      # ==================================================================
      - type: grid
        cards:
          - type: heading
            heading: Pump
            heading_style: title
            icon: mdi:water-pump

          - type: tile
            entity: light.gardyn_01_pump
            name: Pump
            icon: mdi:water-pump
            features_position: bottom
            features:
              # The pump is published as an MQTT light; brightness == speed %.
              - type: light-brightness

          - type: heading
            heading: Pump Schedule
            heading_style: subtitle
            icon: mdi:calendar-clock

          - type: entities
            show_header_toggle: false
            entities:
              - entity: switch.gardyn_01_sched_pump
                name: Schedule enabled
              - entity: time.gardyn_01_sched_pump_time
                name: First run at
              - entity: number.gardyn_01_sched_pump_duration
                name: Minutes per run
              - type: divider
              - entity: sensor.gardyn_01_pump_next_run
                name: Next run
              - entity: sensor.gardyn_01_pump_max_seconds
                name: Hard cap per run

          - type: markdown
            content: >
              With a multi-cycle schedule (currently seven runs a day), these
              two controls edit it rather than replace it: **Minutes per run**
              applies to every existing run and keeps the run count, and
              **First run at** moves only the first run of each day. A single
              scalar cannot express the other six runs -- add, remove, or
              retime those in the tower web UI heatmap.

      # ==================================================================
      # 4. ONE-TIME PUMP RUN -- additive, never touches the recurring
      #    schedule (its cron entries live under a separate marker).
      # ==================================================================
      - type: grid
        cards:
          - type: heading
            heading: One-Time Pump Run
            heading_style: title
            icon: mdi:water-plus-outline

          - type: entities
            show_header_toggle: false
            entities:
              - entity: time.gardyn_01_sched_pump_manual_time
                name: Run at
              - entity: button.gardyn_01_pump_run_once
                name: Arm one-time run
              - type: divider
              - entity: sensor.gardyn_01_pump_once_next
                name: Pending run

          - type: markdown
            content: >
              Set the time, then press **Arm one-time run**. This writes a
              single dated cron entry under its own marker and leaves the
              recurring schedule untouched; spent entries are pruned by the
              nightly refresh.

      # ==================================================================
      # 5. ENVIRONMENT -- ambient readings, nothing actionable.
      # ==================================================================
      - type: grid
        cards:
          - type: heading
            heading: Environment
            heading_style: title
            icon: mdi:thermometer

          - type: tile
            entity: sensor.gardyn_01_temperature
            name: Air Temperature
          - type: tile
            entity: sensor.gardyn_01_humidity
            name: Humidity
          - type: tile
            entity: sensor.gardyn_01_pcb_temp
            name: PCB Temperature
          - type: tile
            entity: sensor.gardyn_01_water_level
            name: Distance to Water

      # ==================================================================
      # 6. CAMERAS
      # ==================================================================
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Cameras
            heading_style: title
            icon: mdi:camera

          - type: picture-entity
            entity: image.gardyn_01_upper_camera
            name: Upper
            camera_view: auto
          - type: picture-entity
            entity: image.gardyn_01_lower_camera
            name: Lower
            camera_view: auto

      # ==================================================================
      # 7. DIAGNOSTICS -- polling, logs, and the physical button. These are
      #    entity_category: diagnostic, so HA hides them from the
      #    auto-generated device page; they only appear if listed here.
      # ==================================================================
      - type: grid
        cards:
          - type: heading
            heading: Diagnostics
            heading_style: title
            icon: mdi:stethoscope

          - type: entities
            show_header_toggle: false
            entities:
              - entity: button.gardyn_01_refresh_all
                name: Refresh all sensors
              - entity: sensor.gardyn_01_refresh_status
                name: Refresh status
              - entity: sensor.gardyn_01_refresh_last
                name: Last refresh
              - type: divider
              - entity: event.gardyn_01_button
                name: Physical button
              - entity: sensor.gardyn_01_log
                name: Last warning/error

