# Example Home Assistant Lovelace dashboard for a Gardyn (issue #63).
#
# A plain single-column card list, kept as the simplest possible starting point.
#
# THIS IS A SUBSET, NOT AN ALTERNATIVE STYLE. It shows 24 of the 47 entities
# mqtt.py discovers. If you want the whole device, use pm-example.yaml in this
# folder; it is the dashboard these towers actually run.
#
# Not shown here (23 of the 47), by group:
#
#   one-time pump runs   button.<id>_pump_run_once
#                        time.<id>_sched_pump_manual_time
#                        sensor.<id>_pump_once_next
#                        sensor.<id>_pump_next_run
#   pump limits          sensor.<id>_pump_max_seconds
#                        sensor.<id>_pump_cutoff_cm
#   pump cleaning        switch.<id>_pump_clean
#                        select.<id>_pump_clean_minutes
#                        sensor.<id>_pump_clean_remaining
#                        sensor.<id>_pump_clean_cutoff
#                        sensor.<id>_pump_clean_result
#   derived water        sensor.<id>_water_depth
#                        sensor.<id>_water_gallons
#                        sensor.<id>_water_low_mode
#   forced refresh       button.<id>_refresh_all
#                        sensor.<id>_refresh_status
#                        sensor.<id>_refresh_last
#   grow reminders       button.<id>_ack_nutrient
#                        button.<id>_ack_reservoir_change
#                        sensor.<id>_food_dose
#   diagnostics          binary_sensor.<id>_pcb_over_temp
#                        event.<id>_button
#                        sensor.<id>_log
#
# So a tower driven from this dashboard alone cannot water on demand, cannot run
# a pump cleaning cycle, cannot acknowledge a grow reminder, and will not surface
# the hardware over-temperature alert. It does show Water Remaining alongside the
# raw airgap, but not depth or gallons.
#
# MQTT discovery suggests default_entity_id = <domain>.<unique_id>.
# Existing registry IDs are preserved. Check the actual IDs before importing;
# bin/ha-align-entity-ids.py provides a dry-run report for older registrations.
# Explicitly renamed entity IDs require corresponding dashboard changes.
# Do not delete devices to align IDs.
#
# Paste into a dashboard via: Settings → Dashboards → (⋮) → Edit → Raw config.

title: Garden of Eden
views:
  - title: Garden
    cards:
      - type: entities
        title: Controls
        entities:
          - entity: light.gardyn_01_light
            name: Grow Light
          - entity: light.gardyn_01_pump
            name: Pump
          - entity: number.gardyn_01_water_low_cm
            name: Low-water threshold (cm)

      - type: glance
        title: Sensors
        entities:
          - entity: sensor.gardyn_01_temperature
            name: Air Temp
          - entity: sensor.gardyn_01_humidity
            name: Humidity
          - entity: sensor.gardyn_01_pcb_temp
            name: PCB Temp
          - entity: sensor.gardyn_01_water_percent
            name: Water Remaining
          - entity: sensor.gardyn_01_water_level
            name: Distance to Water
          - entity: binary_sensor.gardyn_01_water_low
            name: Water Low

      - type: entities
        title: Grow Cycle
        entities:
          - entity: select.gardyn_01_grow_stage
            name: Stage
          - entity: sensor.gardyn_01_grow_day
            name: Day
          - entity: sensor.gardyn_01_grow_reminder
            name: Reminder
          - entity: binary_sensor.gardyn_01_food
            name: Add plant food
          - entity: button.gardyn_01_grow_start
            name: Start new cycle

      - type: entities
        title: Schedule
        # All four setters below edit the saved schedule in place rather than
        # replacing it, so a multi-window/multi-run day survives:
        #   Brightness / Pump minutes -- applied to every existing window/run,
        #                                keeping the count and each one's times
        #   Lights on/off / Pump run at -- move only the FIRST window/run of
        #                                  each day; later ones are untouched
        # A scalar cannot express the later windows/runs, so add, remove, or
        # retime those in the web UI heatmap (http://gardyn.local:5000/).
        entities:
          - entity: switch.gardyn_01_sched_lights
            name: Lights schedule
          - entity: time.gardyn_01_sched_lights_on
            name: Lights on
          - entity: time.gardyn_01_sched_lights_off
            name: Lights off
          - entity: number.gardyn_01_sched_lights_brightness
            name: Brightness
          - entity: switch.gardyn_01_sched_pump
            name: Pump schedule
          - entity: time.gardyn_01_sched_pump_time
            name: Pump run at
          - entity: number.gardyn_01_sched_pump_duration
            name: Pump minutes
          - entity: switch.gardyn_01_vacation
            name: Vacation mode

      - type: picture-entity
        title: Upper Camera
        entity: image.gardyn_01_upper_camera
        camera_view: auto

      - type: picture-entity
        title: Lower Camera
        entity: image.gardyn_01_lower_camera
        camera_view: auto

