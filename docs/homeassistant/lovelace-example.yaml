# Example Home Assistant Lovelace dashboard for a Gardyn (issue #63).
#
# A plain single-column card list. For a grouped, status-first layout using
# HA's Sections view, see pm-example.yaml in this folder.
#
# All entities are created automatically via MQTT discovery by mqtt.py. HA
# builds each entity_id as <domain>.<device>_<entity name>, where the device is
# named after MQTT_BASETOPIC (default "gardyn") -- so the "Water Depth" sensor
# is sensor.gardyn_water_depth. Note this is the *base topic*, not
# MQTT_IDENTIFIER, and it is the entity's display name that is slugified, not
# its unique_id. The two cameras are the exception: their discovery payloads
# set object_id, so they carry MQTT_IDENTIFIER (default "gardyn-xx", "gardyn_01"
# on the PushMotion tower). Verify anything you are unsure of in
# Developer Tools → States, filtered on "gardyn".
#
# Paste into a dashboard via: Settings → Dashboards → (⋮) → Edit → Raw config.

title: Garden of Eden
views:
  - title: Garden
    cards:
      - type: entities
        title: Controls
        entities:
          - entity: light.gardyn_light
            name: Grow Light
          - entity: light.gardyn_pump
            name: Pump
          - entity: number.gardyn_set_water_low_threshold
            name: Low-water threshold (cm)

      - type: glance
        title: Sensors
        entities:
          - entity: sensor.gardyn_temperature
            name: Air Temp
          - entity: sensor.gardyn_humidity
            name: Humidity
          - entity: sensor.gardyn_pcb_temperature
            name: PCB Temp
          - entity: sensor.gardyn_water_level
            name: Water Level
          - entity: binary_sensor.gardyn_water_low
            name: Water Low

      - type: entities
        title: Grow Cycle
        entities:
          - entity: select.gardyn_grow_stage
            name: Stage
          - entity: sensor.gardyn_grow_day
            name: Day
          - entity: sensor.gardyn_grow_reminder
            name: Reminder
          - entity: binary_sensor.gardyn_add_plant_food
            name: Add plant food
          - entity: button.gardyn_start_new_grow_cycle
            name: Start new cycle

      - type: entities
        title: Schedule
        # All four setters below edit the saved schedule in place rather than
        # replacing it, so a multi-window/multi-run day survives:
        #   Brightness / Pump minutes -- applied to every existing window/run,
        #                                keeping the count and each one's times
        #   Lights on/off / Pump run at -- move only the FIRST window/run of
        #                                  each day; later ones are untouched
        # A scalar cannot express the later windows/runs, so add, remove, or
        # retime those in the web UI heatmap (http://gardyn.local:5000/).
        entities:
          - entity: switch.gardyn_lights_schedule
            name: Lights schedule
          - entity: time.gardyn_lights_on_time
            name: Lights on
          - entity: time.gardyn_lights_off_time
            name: Lights off
          - entity: number.gardyn_schedule_brightness
            name: Brightness
          - entity: switch.gardyn_pump_schedule
            name: Pump schedule
          - entity: time.gardyn_pump_run_time
            name: Pump run at
          - entity: number.gardyn_pump_run_duration
            name: Pump minutes
          - entity: switch.gardyn_vacation_mode
            name: Vacation mode

      - type: picture-entity
        title: Upper Camera
        entity: image.gardyn_01_upper_camera
        camera_view: auto

      - type: picture-entity
        title: Lower Camera
        entity: image.gardyn_01_lower_camera
        camera_view: auto

